name: Android Build

on:
  push:
    branches:
      - feature/pro-dashboard-map
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          validate-wrappers: false

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Run Android unit tests and lint
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: horus-maps-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
